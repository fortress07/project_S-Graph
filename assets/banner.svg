<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="S-Graph — vẽ đồ thị và tính diện tích hình phẳng">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="region" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c8dff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4c8dff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4c8dff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4c8dff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4c8dff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2334" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <clipPath id="plot"><rect width="300" height="250"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Minh hoạ thật: vùng giới hạn bởi y = x² và y = x trên [0, 1], S = 1/6 -->
    <g transform="translate(760 25)" clip-path="url(#plot)">
      <path d="M0 195.7H300" stroke="#3a4459" stroke-width="1.5"/>
      <path d="M68.2 0V250" stroke="#3a4459" stroke-width="1.5"/>
      <path d="M68.2 195.7L72.4 191.4L76.7 187.2L81 182.9L85.2 178.7L89.5 174.4L93.8 170.2L98 165.9L102.3 161.7L106.5 157.4L110.8 153.2L115.1 148.9L119.3 144.7L123.6 140.5L127.8 136.2L132.1 132L136.4 127.7L140.6 123.5L144.9 119.2L149.1 115L153.4 110.7L157.7 106.5L161.9 102.2L166.2 98L170.5 93.8L174.7 89.5L179 85.3L183.2 81L187.5 76.8L191.8 72.5L196 68.3L200.3 64L204.5 59.8L204.5 59.8L200.3 68.1L196 76.2L191.8 84.1L187.5 91.6L183.2 98.9L179 106L174.7 112.7L170.5 119.2L166.2 125.5L161.9 131.4L157.7 137.1L153.4 142.6L149.1 147.8L144.9 152.7L140.6 157.3L136.4 161.7L132.1 165.8L127.8 169.6L123.6 173.2L119.3 176.5L115.1 179.6L110.8 182.4L106.5 184.9L102.3 187.2L98 189.2L93.8 190.9L89.5 192.3L85.2 193.5L81 194.5L76.7 195.1L72.4 195.5L68.2 195.7Z" fill="url(#region)" stroke="#4c8dff" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M0 161.7L4.8 166.3L9.7 170.6L14.5 174.6L19.3 178.2L24.1 181.5L29 184.4L33.8 187L38.6 189.3L43.5 191.2L48.3 192.8L53.1 194L58 194.9L62.8 195.4L67.6 195.6L72.4 195.5L77.3 195L82.1 194.2L86.9 193.1L91.8 191.6L96.6 189.8L101.4 187.6L106.2 185.1L111.1 182.2L115.9 179L120.7 175.5L125.6 171.6L130.4 167.4L135.2 162.8L140.1 157.9L144.9 152.7L149.7 147.1L154.5 141.2L159.4 134.9L164.2 128.3L169 121.3L173.9 114L178.7 106.4L183.5 98.4L188.4 90.1L193.2 81.5L198 72.5L202.8 63.2L207.7 53.5L212.5 43.5L217.3 33.1L222.2 22.4L227 11.4L231.8 0" fill="none" stroke="#4c8dff" stroke-width="3" stroke-linecap="round"/>
      <path d="M13.6 250L259.1 5.4" fill="none" stroke="#f2555a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="68.2" cy="195.7" r="7" fill="#22c58b" stroke="#0d1220" stroke-width="2.5"/>
      <circle cx="204.5" cy="59.8" r="7" fill="#22c58b" stroke="#0d1220" stroke-width="2.5"/>
    </g>

    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <g transform="translate(72 74)">
        <rect width="46" height="46" rx="12" fill="#4c8dff"/>
        <path d="M9 35C18 35 19 12 27 12s10 14 13 14" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round"/>
      </g>
      <text x="136" y="108" fill="#f3f6fb" font-size="46" font-weight="700" letter-spacing="-1">S-Graph</text>
      <text x="72" y="164" fill="#9aa7bd" font-size="20" font-weight="500">Vẽ đồ thị và tính diện tích hình phẳng bằng cách bấm chọn điểm</text>
      <g font-size="14" font-weight="600">
        <g transform="translate(72 192)"><rect width="128" height="30" rx="15" fill="#161e2e" stroke="#28324a"/><text x="17" y="20" fill="#8fb4ff">định lý Green</text></g>
        <g transform="translate(212 192)"><rect width="138" height="30" rx="15" fill="#161e2e" stroke="#28324a"/><text x="17" y="20" fill="#8fb4ff">đường cong ẩn</text></g>
        <g transform="translate(362 192)"><rect width="116" height="30" rx="15" fill="#161e2e" stroke="#28324a"/><text x="17" y="20" fill="#8fb4ff">toạ độ cực</text></g>
      </g>
      <text x="72" y="256" fill="#6b7a94" font-size="14" font-family="ui-monospace, Menlo, Consolas, monospace">S = ∫₀¹ (x − x²) dx = 1/6</text>
    </g>
    <rect y="297" width="1200" height="3" fill="url(#glow)"/>
  </g>
</svg>
